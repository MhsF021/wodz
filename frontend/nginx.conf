# Não registra IP, URL, query string, Referer, corpo ou credenciais. Códigos de
# inscrição e retornos OAuth são capacidades de acesso e não devem ir a logs.
log_format wodz_privacy '$time_iso8601 $request_method $status $body_bytes_sent $request_time';

# Apenas tentativas de autenticação consomem a cota. Se houver proxy/CDN, ajuste
# real_ip com uma lista explícita de proxies confiáveis antes de usar IP real.
map "$request_method:$uri" $wodz_auth_limit_key {
    default "";
    ~^POST:/api/auth/(login|register|google)$ $binary_remote_addr;
    ~^POST:/api/public/google/callback$ $binary_remote_addr;
}
limit_req_zone $wodz_auth_limit_key zone=wodz_auth:10m rate=10r/m;

server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 2m;
    access_log /dev/stdout wodz_privacy;
    include /etc/nginx/wodz-security-headers.conf;
    limit_req zone=wodz_auth burst=10 nodelay;
    limit_req_status 429;

    # API + Server-Sent Events (sem buffer para o leaderboard ao vivo)
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_set_header Host $proxy_host;
        # O navegador chama /api na mesma origem do frontend. O Origin externo
        # não deve ser revalidado pelo backend após atravessar este proxy confiável.
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/wodz-security-headers.conf;
        proxy_read_timeout 1h;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/wodz-security-headers.conf;
    }

    # SPA: rotas do React Router
    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/wodz-security-headers.conf;
        # Aplicado apenas ao documento SPA. O callback Google tem seu próprio nonce.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data: blob:; connect-src 'self' https:; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
