services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wodz
      POSTGRES_USER: wodz
      POSTGRES_PASSWORD: wodz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wodz -d wodz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/wodz
      DB_USER: wodz
      DB_PASSWORD: wodz
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-longo-e-aleatorio-com-32+caracteres}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://localhost:5173}
      SEED_DEMO: ${SEED_DEMO:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_PUBLIC_KEY: ${MP_PUBLIC_KEY:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_NOTIFICATION_URL: ${MP_NOTIFICATION_URL:-}
      MP_THREE_D_SECURE: ${MP_THREE_D_SECURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-84072245662-m7cc1brb2fb7lkv92i9dqm5o1phnagr9.apps.googleusercontent.com}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
