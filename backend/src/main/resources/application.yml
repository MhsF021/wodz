spring:
  application:
    name: wodz-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wodz}
    username: ${DB_USER:wodz}
    password: ${DB_PASSWORD:wodz}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # o schema é do Flyway (tabelas, triggers, functions, procedures)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  # dev | homolog | prod. Fora de dev a API só sobe com Mercado Pago real e segredos próprios.
  environment: ${APP_ENV:dev}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # Em produção use um segredo aleatório com 32+ caracteres (ex.: openssl rand -base64 48)
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    ttl: ${JWT_TTL:12h}
    issuer: wodz
  payment:
    provider: ${PAYMENT_PROVIDER:sandbox}     # sandbox | mercadopago
    pix-expiration: ${PIX_EXPIRATION:30m}
    mercadopago:
      # Aplicação da plataforma no Mercado Pago (split 1:1). Os organizadores conectam
      # a própria conta por OAuth; o dinheiro das inscrições cai direto na conta deles.
      client-id: ${MP_CLIENT_ID:}
      client-secret: ${MP_CLIENT_SECRET:}
      # APIs oficiais com credenciais de teste (OAuth test_token=true), sem o simulador local.
      test-mode: ${MP_TEST_MODE:false}
      public-key: ${MP_PUBLIC_KEY:}
      webhook-secret: ${MP_WEBHOOK_SECRET:}
      notification-url: ${MP_NOTIFICATION_URL:}
      # 3DS 2.0 nos cartões (crédito e débito). Só desligue se a conta do Mercado Pago não suportar.
      three-d-secure: ${MP_THREE_D_SECURE:true}
      # Percentual retido pela plataforma em cada inscrição (application_fee). 0 = nada.
      platform-fee-percent: ${MP_PLATFORM_FEE_PERCENT:0}
      # Chave usada para tokenizar o cartão: platform (padrão da documentação do split) ou seller.
      card-public-key-source: ${MP_CARD_PUBLIC_KEY_SOURCE:platform}
  security:
    # 32 bytes em Base64 (openssl rand -base64 32). Cifra os tokens das contas de recebimento.
    # Vazio só é aceito em dev. Trocar a chave invalida as contas já conectadas.
    encryption-key: ${APP_ENCRYPTION_KEY:}
  seed:
    enabled: ${SEED_DEMO:false}
  google:
    # Client ID OAuth (tipo "Aplicativo da Web") do Google Cloud; é público, vai para o navegador.
    client-id: ${GOOGLE_CLIENT_ID:84072245662-m7cc1brb2fb7lkv92i9dqm5o1phnagr9.apps.googleusercontent.com}

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info
